url: https://rjbgoudie.github.io/omopesutils/

template:
  bootstrap: 5
  bslib:
    primary: "#1b4a6b"

reference:
- title: Running the pipeline
  desc: >
    Run an OMOP-ES pipeline, optionally at a particular commit of the OMOP-ES
    repository so that two versions can be compared.
  contents:
  - omop_es_run
  - omop_es_run_git_sha
  - omop_es_main_cuh_interactive

- title: Loading extracts into duckdb
  desc: >
    Register an OMOP-ES extract as a set of duckdb views, so that it can be
    queried with dplyr and dbplyr without copying any data.
  contents:
  - duckdb_register_omop_es_output
  - duckdb_register_omop_es_datalake
  - dbListOmopTables

- title: Downloading OMOP vocabularies
  desc: >
    Download the OMOP vocabulary tables as parquet from the published
    omop-vocabs-processed releases, and register them in duckdb. This gets the
    vocabularies without an OMOP-ES checkout or a database, and works in the
    browser under webR as well as locally.
  contents:
  - omop_vocab_download
  - duckdb_register_omop_vocabs
  - omop_vocab_dir
  - omop_vocab_parquet_url
  - omop_vocab_processed_tables

- title: Browsing and diffing extracts
  desc: >
    Shiny applications for looking at what the pipeline produced, and for
    comparing two extracts row by row.
  contents:
  - omop_es_viewer
  - omop_es_diff_viewer
  - omop_es_diff_viewer_local_git

- title: Generate documentation for an OMOP-ES extract
  desc: >
    Recover the SQL queries, source database tables and hand-written
    documentation belonging to each OMOP-ES plugin, by running the plugins
    with database access stubbed out, and render the result as a report
    describing what an extract contains and where it came from.
  contents:
  - omop_es_extract_summary_report
  - omop_es_plugins_extract_sql
  - omop_es_plugins_extract_tables
  - omop_es_plugins_extract_docs_public
  - omop_es_plugins_extract_docs_private
  - omop_es_plugins_extract_metadata

- title: Cross-tabulating concept columns
  desc: >
    Count how each concept column of an extract has been populated, which
    concepts were used and which rows are unmapped. This is the material the
    extract summary report is built from.
  contents:
  - omop_cross_tabulation
  - omop_table_cross_tabulation

- title: Extract summary report sections
  desc: >
    The building blocks of the extract summary report. Each returns a list of
    HTML named by OMOP table, which the report template interleaves into
    per-table sections. They are exported because the bundled R Markdown
    template calls them.
  contents:
  - omop_es_extract_summary_all_tables
  - omop_es_all_tables_headings_html
  - omop_es_markdown_docs_public_html
  - omop_es_markdown_docs_private_html
  - omop_es_field_level_summary_html
  - omop_es_cross_tabulations_html
  - omop_es_data_provenance_html

- title: Concept mapping tables
  desc: >
    Annotate concept ids with their name, vocabulary, domain and
    standard-concept status, and render the result as a table or a report.
  contents:
  - decorate_mapping_table
  - gt_decorate_mapping_table
  - mapping_table_report

- title: OMOP CDM metadata
  desc: >
    The OMOP CDM v5.4 specification shipped with the package, and the table
    names derived from it.
  contents:
  - omop_metadata_table_level
  - omop_all_tables
  - omop_cdm_tables
